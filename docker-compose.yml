services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
      POSTGRES_DB: ${PGDATABASE:-deals_bigdata}
      N_PRICES: ${N_PRICES:-300000}
    ports:
      - "${PG_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/source:/sql-source:ro
      - ./docker/init-source.sh:/docker-entrypoint-initdb.d/10-init-source.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${PGUSER:-postgres} -d ${PGDATABASE:-deals_bigdata}"]
      interval: 5s
      timeout: 5s
      retries: 60

  pipeline:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-postgres}
      PGDATABASE: ${PGDATABASE:-deals_bigdata}
      AS_OF_DATE: ${AS_OF_DATE:-2026-10-26}
      ETL_START_DATE: ${ETL_START_DATE:-}
      ETL_END_DATE: ${ETL_END_DATE:-}
      RANDOM_SEED: ${RANDOM_SEED:-42}
      RUN_ML: ${RUN_ML:-1}

volumes:
  pgdata:
